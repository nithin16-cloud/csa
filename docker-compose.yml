version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudsky_airways
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=cloudsky-prod-docker-secret-key-change-in-real-prod
      - DATABASE_PATH=/app/data/cloudsky.db
      - SESSION_COOKIE_SECURE=0
      - PORT=5000
    volumes:
      - cloudsky_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cloudsky_data:
    driver: local
