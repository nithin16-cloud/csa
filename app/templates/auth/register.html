{% extends "base.html" %}

{% block title %}Create Account — CloudSky Airways{% endblock %}

{% block content %}
<div class="section-container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <div class="auth-card" style="max-width: 520px; margin: 0 auto; background: #FFFFFF; border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 2.75rem 2.25rem; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <h1 style="font-size: 1.85rem; color: var(--accent-navy); margin-bottom: 0.35rem;">Join CloudSky Airways</h1>
            <p style="color: var(--text-subtle); font-size: 0.92rem;">Enjoy faster bookings, guaranteed seat holds, and trip management.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="name"><i class="fa-regular fa-user"></i> Full Name</label>
                <input type="text" name="name" id="reg-name" class="form-control" placeholder="e.g. Rohan Sharma" required value="{{ name or '' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" name="email" id="reg-email" class="form-control" placeholder="e.g. rohan.sharma@example.in" required value="{{ email or '' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="phone"><i class="fa-solid fa-phone"></i> Mobile Phone (India)</label>
                <input type="tel" name="phone" id="reg-phone" class="form-control" placeholder="+91 98765 43210" value="{{ phone or '' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="password"><i class="fa-solid fa-lock"></i> Password (min. 6 characters)</label>
                <input type="password" name="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group" style="margin-bottom: 1.6rem;">
                <label for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                <input type="password" name="confirm_password" id="reg-confirm" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.5rem;">
                <i class="fa-solid fa-user-plus"></i> Create Account & Sign In
            </button>

            <div style="text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
                <span style="font-size: 0.9rem; color: var(--text-subtle);">Already have an account? </span>
                <a href="{{ url_for('auth.login') }}" style="font-weight: 700; color: var(--primary);">Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
