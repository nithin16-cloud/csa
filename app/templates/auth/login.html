{% extends "base.html" %}

{% block title %}Sign In — CloudSky Airways{% endblock %}

{% block content %}
<div class="section-container" style="padding-top: 3.5rem; padding-bottom: 5rem;">
    <div class="auth-card" style="max-width: 480px; margin: 0 auto; background: #FFFFFF; border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 2.75rem 2.25rem; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <h1 style="font-size: 1.85rem; color: var(--accent-navy); margin-bottom: 0.35rem;">Welcome to CloudSky</h1>
            <p style="color: var(--text-subtle); font-size: 0.92rem;">Sign in to access your flight itineraries and member perks.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" name="email" id="login-email" class="form-control" placeholder="name@domain.com" required value="{{ email or '' }}">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.25rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>

            <!-- Quick Demo Login Button for Instant Testing -->
            <button type="button" class="btn btn-secondary btn-block btn-sm" id="btn-demo-fill" style="margin-bottom: 1.75rem;">
                <i class="fa-solid fa-key"></i> Quick Fill Demo Account
            </button>

            <div style="text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
                <span style="font-size: 0.9rem; color: var(--text-subtle);">New to CloudSky? </span>
                <a href="{{ url_for('auth.register') }}" style="font-weight: 700; color: var(--primary);">Create an Account</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById("btn-demo-fill")?.addEventListener("click", () => {
        document.getElementById("login-email").value = "rohan.sharma@example.in";
        document.getElementById("login-password").value = "Password@123";
    });
</script>
{% endblock %}
